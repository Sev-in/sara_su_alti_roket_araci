# Arduino Uno + PCA9685 donanim koprusu.
actuator_driver:
  ros__parameters:
    serial_port: '/dev/ttyUSB0'
    serial_baud: 115200
    # Surucu, bu sabit sureyi beklemek yerine Uno'nun READY mesajini
    # bekler. Bu deger yalnizca READY gelmezse tani zaman asimidir.
    uno_ready_timeout_s: 15.0
    command_rate_hz: 20.0
    heartbeat_rate_hz: 5.0
    command_timeout_s: 0.5
    reconnect_interval_s: 1.0

    servo_center_deg: 90.0
    # CH1 pitch ve CH2 yaw kontrol servolari 90 derece merkezden
    # iki yonde en fazla 35 derece sapar (fiziksel komut araligi 55..125).
    pitch_max_offset_deg: 35.0
    yaw_max_offset_deg: 35.0
    # PID hatasi hedef-mevcut olarak tanimlidir. Standalone kod ise
    # mevcut-referans kullandigi icin eski -1 isaretlerini burada tekrar
    # uygulamak fiziksel servo yonunu tersine ceviriyordu.
    pitch_sign: 1.0
    yaw_sign: 1.0
    nose_closed_deg: 0.0
    nose_open_deg: 90.0

    # Autopilot yuzeye cikis icin negatif sephiye komutu uretir.
    buoyancy_surface_threshold: -0.05
    # Bench'te enable_surface_servo:=true veya sara_system.launch.py'de
    # surface_servo_test_mode:=true ile Uno D6 servosu 1900 us disari itme
    # ve 1500 us notr desenini tekrarlar.
    # Normal gorevde kesinlikle false kalmalidir.
    surface_servo_test_mode: false
    # Yalnizca test modunda kullanilir: 1100=iceri cek, 1900=disari it.
    # Normal gorev bu parametreyi dikkate almaz ve daima 1900 kullanir.
    surface_servo_test_pulse_us: 1900
    # Yalniz bench launch'ta acik onayla true yapilir. Normal gorevde
    # 3 V cikisi safety tarafindan otomatik yonetilir.
    ignition_manual_test_mode: false

    # Uno, acilista aldigi sifira gore gauge kPa yollar. ROS mesajina
    # donusurken bu yuzey referansi eklenir; navigation.py yine kendi
    # guvenli P0 kalibrasyonunu yapar.
    surface_reference_pa: 101325.0
    pressure_variance_pa2: 0.0
    pressure_min_pa: 80000.0
    pressure_max_pa: 1700000.0
