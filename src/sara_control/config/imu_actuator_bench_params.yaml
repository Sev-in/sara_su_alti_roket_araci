# Pixhawk/PID/servo ve sinirli motor tezgah testi.
# Gercek gorev akisini, burun kapagini, siringayi veya ateslemeyi baslatmaz.
imu_actuator_bench:
  ros__parameters:
    enable_motor: false
    confirm_motor_test_safe: false
    motor_test_speed_ms: 0.15
    # Geri donussuz D5 HIGH testi varsayilan olarak kapali ve iki onaylidir.
    enable_power_cutoff_test: false
    confirm_power_cutoff_test_safe: false
    # Ters PWM yonunde once 0.50, gerekirse 0.70 m/s denenmelidir.
    # 0.70 m/s, onceki 0.50 m/s / 2200 us testine yakin darbe sapmasi
    # uretirken 1000 us belgeli sinirin icinde kalir.
    max_motor_test_speed_ms: 0.70
    max_calibrated_speed_ms: 1.076
    pitch_max_angle_deg: 35.0
    yaw_max_angle_deg: 35.0
    # CH1 hassasiyeti: 4.0 ile 8.75 derece bagil pitch, servoda
    # merkezden 35 derece (55/125 derece siniri) uretir.
    # Tum bench testlerinde kalici kullanilir; launch argumani gerekmez.
    pitch_gain: 4.0
    # CH2'nin mevcut roll/yaw test kazanci; CH1 artik bunu kullanmaz.
    gain: 1.0
    sign_pitch: -1.0
    sign_roll: -1.0
    sign_yaw: -1.0
    imu_timeout_s: 0.5
    water_timeout_s: 1.0
    water_debounce_s: 0.3
    # CH3 burun ayirma: burun kuru + kuyruk islak + referansa gore
    # en az +30 derece burun-yukari pitch birlikte gerekli.
    nose_open_min_pitch_deg: 30.0
    # Montajda burun-yukari relative_pitch negatif okunursa -1.0 yapilir.
    nose_open_pitch_sign: 1.0
    publish_rate_hz: 20.0
