# Pixhawk/PID/servo ve sinirli motor tezgah testi.
# Gercek gorev akisini, burun kapagini, siringayi veya ateslemeyi baslatmaz.
imu_actuator_bench:
  ros__parameters:
    enable_motor: false
    confirm_motor_test_safe: false
    motor_test_speed_ms: 0.15
    max_motor_test_speed_ms: 0.25
    max_calibrated_speed_ms: 1.076
    pitch_max_angle_deg: 35.0
    yaw_max_angle_deg: 35.0
    gain: 1.0
    sign_pitch: -1.0
    sign_roll: -1.0
    sign_yaw: -1.0
    imu_timeout_s: 0.5
    publish_rate_hz: 20.0
