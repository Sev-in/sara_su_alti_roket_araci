# guidance_params.yaml
# SARA platformu - Gudum Katmani parametreleri (v3 - granuler faz mimarisi)
# Kullanim: ros2 run sara_control guidance --ros-args --params-file <bu_dosya>
#           veya launch dosyasinda parameters=[<bu_dosyanin_yolu>]

guidance_node:
  ros__parameters:
    mission_id: 1                     # 1=Seyir Gorevi, 2=Atis Gorevi

    # --- Ortak toleranslar ---
    dive_target_depth: 2.0            # [m] - Gorev1 madde1 (Gorev2 icin de varsayilan)
    depth_tolerance: 0.15             # [m]
    heading_tolerance: 0.10           # [rad] (~5.7 derece) - kanitlanmis deger
    pitch_tolerance: 0.10             # [rad]

    # --- Zamanlama / kararlilik ---
    kararlilik_suresi_s: 3.0          # G1 ve ortak kosullar icin
    g2_condition_hold_s: 1.0          # G2 faz gecislerinde filtreli kosul dogrulama
    g2_launch_hold_s: 0.5             # Safety katmani da bagimsiz kontrol eder
    max_mission_duration_s: 600.0     # fail-safe: azami gorev suresi
    # Sartnamedeki "verilecek sure" puanlama penceresidir. Asilmasi
    # gorevi durdurmaz; telemetride WARN uretilir ve arac devam eder.
    g1_max_race_duration_s: 180.0     # Asama-1 resmi puanlama suresi
    g2_max_race_duration_s: 60.0      # Asama-2 resmi puanlama suresi
    g2_ates_sinyali_timeout_s: 30.0   # atesleme fazina ozel, bagimsiz zaman asimi
    g2_actuator_status_timeout_s: 1.5 # Uno/eyleyici atesleme onayi canlilik siniri
    nav_status_timeout_s: 2.0         # fail-safe: navigasyon veri zaman asimi
    motion_permission_timeout_s: 1.0  # mission_start hareket izni canlilik siniri
    startup_grace_period_s: 5.0       # baslangicta nav fail-safe'i erken tetiklenmesin
    control_rate_hz: 10.0
    water_debounce_s: 0.3              # SEN0368 yalanci gecislerini engeller

    # --- Faz hizlari (KTR Tablo 1 / Tablo 2 ile dogrulanan gercek degerler) ---
    max_calibrated_speed_ms: 1.076    # tam itkide (thrust=1.0) ulasilan hiz
    g1_calib_speed_ms: 0.895          # ilk 10 m dinamik dalis/stabilizasyon,
                                       # G1_40_50M_YAVASLAMA,
                                       # G1_U_DONUS, G1_KIYIYA_YAKLASMA
    g1_cruise_speed_ms: 1.076         # G1_10_40M_ANA_SEYIR, G1_GERI_DONUS_HIZLI
    # Ilk testte 0.400 m/s dalis 19.4 sn surdu ve atesleme 60 sn'ye
    # sigmadi. 0.600 m/s hala tam itkinin yalnizca yaklasik %56'sidir.
    g2_dive_speed_ms: 0.600           # 60 sn butcesi icin kontrollu dinamik dalis
    g2_transit_speed_ms: 1.076        # G2_30M_TAMAMLAMA_SEYIR - YENI, duzeltme fazi
    g2_ascend_speed_ms: 0.450         # 35 derece cikisi 60 sn icinde tamamlamak icin

    # --- Gorev 1 (Seyir) mesafe esikleri - KTR Tablo 1 ile birebir ---
    # Iki 10 m degeri farkli gereksinimlerdir:
    # - ilk 10 m tamamlaninca yarisma suresi baslar,
    # - gorev sonunda arac kiyidan 10 m uzaktaki bitis alanina doner.
    g1_initial_timing_distance_m: 10.0
    g1_finish_distance_from_shore_m: 10.0 # kiyidan hedef bitis uzakligi
    g1_ana_seyir_distance_m: 40.0          # 10-40m ana seyir sonu
    g1_uzaklasma_min_distance_m: 50.0       # 40-50m yavaslama sonu / madde4: kiyidan en az 50m
    g1_yaklasma_baslangic_m: 15.0            # geri donus hizli seyir sonu (bitis cizgisine ~15m kala yavasla)
    # Sartname: Gorev 1, kiyidan 10 m uzaktaki baslangic/bitis alaninda
    # sonlanir. Hedef konum g1_finish_distance_from_shore_m=10.0 ile tanimlidir;
    # bu deger hedefin etrafindaki kabul yari genisligidir (8-12 m).
    g1_bitis_cizgisi_tolerance_m: 2.0

    # --- Gorev 2 (Atis) mesafe/aci esikleri ---
    g2_duz_seyir_distance_m: 30.0         # madde1: 30 m duz git (ACILI_DALIS + 30M_TAMAMLAMA_SEYIR
                                           # TOPLAMDA bu mesafeyi kat eder)
    # Sartname Sekil 3: 30 m minimum uzaklasma cizgisidir. Guvenli atis
    # bolgesi bu cizgiden sonra baslar; sartnamede ust mesafe siniri yoktur.
    g2_safe_zone_min_m: 30.0
    g2_tirmanis_target_pitch_deg: 35.0    # sartname: >30 derece, 35 pay icin kullanildi
    g2_min_launch_pitch_deg: 31.0         # sartname 4.1: ">30 derece"; 1 derece emniyet payi
    g2_firing_depth: 0.0                  # gercek yuzey (0m) - ara derinlik DEGIL
    g2_nose_cap_open_duration_s: 3.0      # TODO: gercek servo suresiyle guncellenecek
