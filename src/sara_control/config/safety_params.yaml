# safety_params.yaml
# SARA platformu - Guvenlik Katmani parametreleri

safety_node:
  ros__parameters:
    nav_status_timeout_s: 2.0
    motion_permission_timeout_s: 1.0
    control_rate_hz: 20.0
    # Sartname 4.1: ">30 derece" - guduмden BAGIMSIZ ikinci dogrulama,
    # Bagimsiz guvenlik esigi de sartnameden daha gevsek olamaz.
    # 31 derece, ">30 derece" kosulunu 1 derece emniyet payiyla uygular.
    launch_min_pitch_deg: 31.0
    g2_safe_zone_min_m: 30.0
    launch_max_depth_m: 0.15
    request_timeout_s: 0.5
    # Burun/kuyruk atis kosulu tek bir gurultulu GPIO ornegine dayanmasin.
    water_debounce_s: 0.3
    # Gercek gorevde acilan burun kapagi tekrar kapanmasin.
    nose_cap_latching: true
    # Normal Gorev 1/2 acil durdurmasi Uno D5 HIGH ile ana guc kesmeyi
    # kilitler. VIDEO_DEMO'da D5 kesilmez; tum eyleyiciler sifirlanir.
    # D5 kilidi yeniden acmak icin fiziksel reset/guc dongusu gerektirir.
    power_cutoff_on_emergency_stop: true
    # Normal Gorev 1/2 icin daima false. video_demo.launch.py tarafindan
    # yalniz havuz gosteriminde ve iki asamali olcum onayiyla ezilir.
    video_demo_mode: false
    video_demo_ignition_enabled: false
    video_demo_max_abs_pitch_deg: 10.0
    video_demo_max_speed_ms: 0.10
    actuator_status_timeout_s: 1.5
